<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 720px; height: 755px; overflow: hidden; background: #ffffff; }
  svg { display: block; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
  .phase { font-size: 13px; font-weight: 600; letter-spacing: 1px; fill: #64748b; }
  .node { stroke-width: 1.4; }
  .label { font-size: 15px; font-weight: 500; fill: #1f2937; text-anchor: middle; }
  .sub { font-size: 12px; font-weight: 400; fill: #64748b; text-anchor: middle; }
  .edge { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
  .edge-loop { fill: none; stroke: #7c6fbd; stroke-width: 1.8; marker-end: url(#arrow-purple); }
  .edge-label { font-size: 13px; font-weight: 600; fill: #475569; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  .shadow { filter: url(#shadow); }
</style>
</head>
<body>
<svg width="720" height="755" viewBox="0 0 720 755" role="img" aria-labelledby="title desc">
  <title id="title">通用 Agent Loop</title>
  <desc id="desc">展示上下文构建、模型调用、工具执行、步数预算和最终答案处理。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c6fbd"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <rect x="20" y="34" width="205" height="98" rx="14" fill="#f5f9ff"/>
  <rect x="242" y="34" width="235" height="700" rx="14" fill="#faf9ff"/>
  <rect x="494" y="34" width="206" height="700" rx="14" fill="#fbfcfd"/>
  <text class="phase" x="38" y="58">输入</text>
  <text class="phase" x="260" y="58">工具循环</text>
  <text class="phase" x="512" y="58">输出</text>

  <rect class="node shadow" x="38" y="72" width="169" height="54" rx="10" fill="#eaf3ff" stroke="#79a6df"/>
  <text class="label" x="122.5" y="96"><tspan x="122.5">System Prompt</tspan><tspan class="sub" x="122.5" dy="18">+ History</tspan></text>

  <rect class="node shadow" x="260" y="72" width="199" height="54" rx="10" fill="#f1edff" stroke="#9a89d5"/>
  <text class="label" x="359.5" y="96"><tspan x="359.5">构建 Tool Registry</tspan><tspan class="sub" x="359.5" dy="18">/ Definitions</tspan></text>

  <rect class="node shadow" x="260" y="158" width="199" height="56" rx="10" fill="#f1edff" stroke="#9a89d5"/>
  <text class="label" x="359.5" y="191">调用 Chat Completion</text>

  <polygon class="node shadow" points="360,244 452,287 360,330 268,287" fill="#fff4e5" stroke="#d69a49"/>
  <text class="label" x="360" y="283"><tspan x="360">是否返回</tspan><tspan x="360" dy="18">tool_calls？</tspan></text>

  <rect class="node shadow" x="260" y="362" width="199" height="56" rx="10" fill="#fff4e5" stroke="#d69a49"/>
  <text class="label" x="359.5" y="395">按返回顺序执行 Tool</text>

  <rect class="node shadow" x="260" y="450" width="199" height="56" rx="10" fill="#f1edff" stroke="#9a89d5"/>
  <text class="label" x="359.5" y="474"><tspan x="359.5">追加 Role=tool</tspan><tspan class="sub" x="359.5" dy="18">Tool Result</tspan></text>

  <polygon class="node shadow" points="360,536 452,579 360,622 268,579" fill="#fff4e5" stroke="#d69a49"/>
  <text class="label" x="360" y="575"><tspan x="360">还有 Step</tspan><tspan x="360" dy="18">Budget？</tspan></text>

  <rect class="node shadow" x="512" y="250" width="170" height="74" rx="10" fill="#eaf8ef" stroke="#6fa981"/>
  <text class="label" x="597" y="280"><tspan x="597">清理格式</tspan><tspan x="597" dy="20">并返回文本</tspan></text>

  <rect class="node shadow" x="512" y="508" width="170" height="66" rx="10" fill="#f1edff" stroke="#9a89d5"/>
  <text class="label" x="597" y="536"><tspan x="597">不再提供 Tools</tspan><tspan class="sub" x="597" dy="18">强制生成最终答案</tspan></text>

  <polygon class="node shadow" points="597,596 682,633 597,670 512,633" fill="#fff4e5" stroke="#d69a49"/>
  <text class="label" x="597" y="638">答案为空？</text>

  <rect class="node shadow" x="275" y="686" width="170" height="52" rx="10" fill="#fff0f0" stroke="#d97a7a"/>
  <text class="label" x="360" y="717">noAnswerWithinSteps</text>
  <rect class="node shadow" x="512" y="686" width="170" height="52" rx="10" fill="#eaf8ef" stroke="#6fa981"/>
  <text class="label" x="597" y="717">返回强制答案</text>

  <path class="edge" d="M207 99 H260"/>
  <path class="edge" d="M360 126 V158"/>
  <path class="edge" d="M360 214 V244"/>
  <path class="edge" d="M452 287 H512"/>
  <text class="edge-label" x="474" y="277">否</text>
  <path class="edge" d="M360 330 V362"/>
  <text class="edge-label" x="372" y="350">是</text>
  <path class="edge" d="M360 418 V450"/>
  <path class="edge" d="M360 506 V536"/>
  <path class="edge-loop" d="M268 579 H245 V186 H260"/>
  <rect x="172" y="365" width="66" height="24" rx="12" fill="#ffffff"/>
  <text class="edge-label" x="205" y="382" text-anchor="middle">是，继续</text>
  <path class="edge" d="M452 579 H482 V541 H512"/>
  <rect x="446" y="539" width="30" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="461" y="555" text-anchor="middle">否</text>
  <path class="edge" d="M597 574 V596"/>
  <path class="edge" d="M552 658 L423 686"/>
  <rect x="469" y="643" width="30" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="484" y="659" text-anchor="middle">是</text>
  <path class="edge" d="M642 658 L621 686"/>
  <rect x="668" y="643" width="30" height="22" rx="11" fill="#ffffff"/>
  <text class="edge-label" x="683" y="659" text-anchor="middle">否</text>
</svg>
</body>
</html>
