<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="diagram-theme.css"><style>html,body{width:720px;height:650px}</style></head><body>
<svg width="720" height="650" viewBox="0 0 720 650" role="img"></svg>
<script src="diagram-runtime.js"></script><script>
initDiagram('FAQ Learning 链路', '从已解决会话中提取人工答案，经过去重和管理员审核后进入知识库。')
panel({x:20,y:20,w:680,h:210,title:'触发与采样',note:'只在 FAQ Learning 开启时进入内存 Mining Queue',number:'1',color:'#79a6df',fill:'#f5f9ff'})
nodeBox({x:38,y:78,w:180,h:78,kind:'blue',lines:['Conversation','从非 Resolved','变为 Resolved']})
diamond({cx:350,cy:117,w:170,h:80,lines:['FAQ Learning','开启？']})
nodeBox({x:520,y:86,w:162,h:62,kind:'purple',lines:['Mining Queue']})
nodeBox({x:466,y:166,w:216,h:48,kind:'purple',lines:['读取最多 40 条公开消息'],sub:'过滤 AI 回复'})
nodeBox({x:268,y:170,w:164,h:42,kind:'gray',lines:['结束']})
edge('M218 117 H265'); edge('M435 117 H520'); edgeLabel(478,106,'是',{pill:true,width:30})
edge('M350 157 V170'); edgeLabel(370,165,'否',{pill:true,width:30})
edge('M601 148 V166')
panel({x:20,y:250,w:680,h:170,title:'提取与去重',note:'模型只产出候选，尚不会直接发布知识',number:'2',color:'#9a89d5',fill:'#faf9ff'})
nodeBox({x:45,y:315,w:180,h:62,kind:'purple',lines:['CompletionRaw'],sub:'提取 JSON FAQ'})
nodeBox({x:270,y:307,w:190,h:78,kind:'orange',lines:['Embedding 相似度','+ Pending Question 去重']})
nodeBox({x:505,y:315,w:170,h:62,kind:'purple',lines:['pending suggestion']})
// 跨阶段连线先经过面板间隙，再沿左侧画布留白进入节点，避开阶段标题与说明。
edge('M574 214 V236 H10 V346 H45'); edge('M225 346 H270'); edge('M460 346 H505')
panel({x:20,y:440,w:680,h:190,title:'管理员审核',note:'人工审核阻断错误知识的自动反馈循环',number:'3',color:'#6fa981',fill:'#f7fbf8'})
diamond({cx:360,cy:510,w:180,h:84,lines:['审核结果']})
nodeBox({x:70,y:566,w:210,h:52,kind:'red',lines:['Reject → rejected']})
nodeBox({x:440,y:558,w:210,h:68,kind:'green',lines:['Approve / Edit'],sub:'创建 enabled Snippet'})
// 审核结果从右侧留白进入菱形，避免穿过第三阶段的标题区。
edge('M590 377 V430 H710 V510 H450')
// 分支标签位于斜线上方；白底与线条留有间隙，不再覆盖并切断箭线。
edge('M310 544 L235 566','edge-soft'); edgeLabel(275,536,'Reject',{pill:true,width:58})
edge('M410 544 L495 558','edge-soft'); edgeLabel(455,535,'Approve / Edit',{pill:true,width:104})
</script></body></html>
