<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 720px; height: 720px; overflow: hidden; background: #ffffff; }
  svg { display: block; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
  .phase-title { font-size: 15px; font-weight: 600; fill: #334155; }
  .phase-note { font-size: 12px; fill: #64748b; }
  .node { stroke-width: 1.3; }
  .label { font-size: 14px; font-weight: 500; fill: #1f2937; text-anchor: middle; }
  .sub { font-size: 11.5px; font-weight: 400; fill: #64748b; text-anchor: middle; }
  .owner { font-size: 11px; font-weight: 600; fill: #64748b; text-anchor: middle; }
  .loop-title { font-size: 11px; font-weight: 600; fill: #64748b; text-anchor: start; }
  .edge { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
  .edge-dashed { fill: none; stroke: #7c6fbd; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrow-purple); }
  .branch { fill: none; stroke: #94a3b8; stroke-width: 1.4; marker-end: url(#arrow); }
  .shadow { filter: url(#shadow); }
</style>
</head>
<body>
<svg width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">自主 Agent 单次运行</title>
  <desc id="desc">将一次自主 Agent Run 分为接收与校验、模型与工具循环、提交结果三个阶段。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c6fbd"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/></filter>
  </defs>

  <rect x="20" y="20" width="680" height="164" rx="16" fill="#f5f9ff"/>
  <circle cx="44" cy="45" r="14" fill="#79a6df"/><text x="44" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">1</text>
  <text class="phase-title" x="68" y="50">接收与校验</text>
  <text class="phase-note" x="68" y="69">只让可处理、仍由 AI 负责的会话进入模型调用</text>

  <rect class="node shadow" x="38" y="94" width="162" height="64" rx="10" fill="#eaf3ff" stroke="#79a6df"/>
  <text class="owner" x="119" y="112">CUSTOMER / MANAGER</text>
  <text class="label" x="119" y="137">Incoming Message</text>
  <rect class="node shadow" x="250" y="86" width="220" height="80" rx="10" fill="#f1edff" stroke="#9a89d5"/>
  <text class="owner" x="360" y="106">AI AGENT WORKER</text>
  <text class="label" x="360" y="130"><tspan x="360">HandleConversation</tspan><tspan x="360" dy="18">Event</tspan></text>
  <rect class="node shadow" x="518" y="86" width="164" height="80" rx="10" fill="#f1edff" stroke="#9a89d5"/>
  <text class="owner" x="600" y="106">PRECHECK</text>
  <text class="label" x="600" y="130"><tspan x="600">去重、状态、身份</tspan><tspan class="sub" x="600" dy="18">与轮次检查</tspan></text>
  <path class="edge" d="M200 126 H250"/>
  <path class="edge" d="M470 126 H518"/>

  <rect x="20" y="202" width="680" height="196" rx="16" fill="#faf9ff"/>
  <circle cx="44" cy="227" r="14" fill="#9a89d5"/><text x="44" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">2</text>
  <text class="phase-title" x="68" y="232">模型与工具循环</text>
  <text class="phase-note" x="68" y="251">Prompt、历史与服务器端 ToolContext 共同进入有步数预算的循环</text>

  <rect class="node shadow" x="38" y="280" width="160" height="68" rx="10" fill="#eaf3ff" stroke="#79a6df"/>
  <text class="owner" x="118" y="299">WORKER</text>
  <text class="label" x="118" y="322"><tspan x="118">Prompt + History</tspan><tspan class="sub" x="118" dy="17">+ ToolContext</tspan></text>

  <rect x="220" y="270" width="330" height="102" rx="12" fill="#ffffff" stroke="#c8bee8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="loop-title" x="236" y="291">LOOP · 最多 maxSteps</text>
  <rect class="node" x="245" y="305" width="110" height="47" rx="9" fill="#f1edff" stroke="#9a89d5"/>
  <text class="label" x="300" y="334">LLM</text>
  <rect class="node" x="430" y="305" width="105" height="47" rx="9" fill="#fff4e5" stroke="#d69a49"/>
  <text class="label" x="482.5" y="334">Business Tool</text>
  <path class="edge" d="M198 314 H245"/>
  <path class="edge" d="M355 318 H430"/>
  <text class="sub" x="392.5" y="306">Tool Call</text>
  <path class="edge-dashed" d="M430 343 H355"/>
  <text class="sub" x="392.5" y="367">Tool Result</text>

  <rect class="node shadow" x="570" y="280" width="112" height="68" rx="10" fill="#eaf8ef" stroke="#6fa981"/>
  <text class="owner" x="626" y="300">RESULT</text>
  <text class="label" x="626" y="326"><tspan x="626">Answer</tspan><tspan class="sub" x="626" dy="17">+ Outcome</tspan></text>
  <path class="edge" d="M550 314 H570"/>

  <rect x="20" y="416" width="680" height="284" rx="16" fill="#fbfcfd"/>
  <circle cx="44" cy="441" r="14" fill="#6fa981"/><text x="44" y="446" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text>
  <text class="phase-title" x="68" y="446">提交结果</text>
  <text class="phase-note" x="68" y="465">输出前重新读取会话，避免覆盖人工接管或错误状态</text>

  <rect class="node shadow" x="75" y="490" width="190" height="58" rx="10" fill="#f1edff" stroke="#9a89d5"/>
  <text class="owner" x="170" y="508">CONVERSATION MANAGER</text>
  <text class="label" x="170" y="533">重新读取 Conversation</text>
  <polygon class="node shadow" points="360,480 440,519 360,558 280,519" fill="#fff4e5" stroke="#d69a49"/>
  <text class="label" x="360" y="515"><tspan x="360">当前状态</tspan><tspan x="360" dy="18">允许提交？</tspan></text>
  <path class="edge" d="M265 519 H280"/>

  <path class="branch" d="M324 548 L139 588"/>
  <path class="branch" d="M360 558 V588"/>
  <path class="branch" d="M396 548 L581 588"/>

  <rect class="node shadow" x="38" y="588" width="202" height="72" rx="10" fill="#fff0f0" stroke="#d97a7a"/>
  <text class="label" x="139" y="614"><tspan x="139">人工已接管 / 状态不可处理</tspan><tspan class="sub" x="139" dy="20">丢弃本轮输出</tspan></text>
  <rect class="node shadow" x="259" y="588" width="202" height="72" rx="10" fill="#fff4e5" stroke="#d69a49"/>
  <text class="label" x="360" y="614"><tspan x="360">Handoff 已执行</tspan><tspan class="sub" x="360" dy="20">不再发送 AI 文本</tspan></text>
  <rect class="node shadow" x="480" y="580" width="202" height="88" rx="10" fill="#eaf8ef" stroke="#6fa981"/>
  <text class="owner" x="581" y="599">NORMAL</text>
  <text class="label" x="581" y="622">QueueReply</text>
  <text class="sub" x="581" y="645">可选：Confirmation → Resolve</text>
</svg>
</body>
</html>
