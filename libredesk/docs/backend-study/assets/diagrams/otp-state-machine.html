<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="diagram-theme.css"><style>html,body{width:980px;height:620px}.edge-label{font-size:13px}.node-title{font-size:15px}</style></head><body>
<svg width="980" height="620" viewBox="0 0 980 620" role="img"></svg>
<script src="diagram-runtime.js"></script><script>
initDiagram('OTP Redis 状态机', 'OTP 在 Unverified、Pending 和 Verified 三个状态之间转换。')
panel({x:20,y:20,w:940,h:580,title:'OTP Redis 状态机',note:'所有验证状态和计数均由服务器端 Redis 与 Lua 维护',number:'',color:'#79a6df',fill:'#fbfcfd'})

// 状态实体单独占据中间水平带，避免动作标签与回退弧线争抢空间。
nodeBox({x:70,y:270,w:210,h:90,kind:'gray',owner:'STATE',lines:['Unverified']})
nodeBox({x:385,y:270,w:210,h:90,kind:'orange',owner:'STATE',lines:['Pending']})
nodeBox({x:700,y:270,w:210,h:90,kind:'green',owner:'STATE',lines:['Verified']})
element('circle',{cx:40,cy:315,r:7,fill:'#334155'}); edge('M47 315 H70')

// 正向动作使用上绕式折线：标签贴近专属水平段，同时避开两侧实体框。
edge('M280 315 H300 V245 H365 V315 H385'); edgeLabel(332.5,232,'send_email_verification',{pill:true,width:184})
edge('M595 315 H615 V245 H680 V315 H700'); edgeLabel(647.5,232,'correct code · atomic Lua',{pill:true,width:190})

// Pending -> Unverified：条件文字在独立顶部带，弧线位于其下方。
edge('M445 270 C420 145 235 145 205 270','edge-soft')
edgeLabel(325,154,'TTL 10m，或第三次错误',{pill:true,width:190})

// Pending 自循环：循环路径与标签均置于状态实体下方。
edge('M545 360 C545 440 435 440 435 360','edge-soft')
edgeLabel(490,448,'wrong code · attempts < 3',{pill:true,width:204})

// Verified -> Unverified：最外层回退使用底部带，避免穿过自循环说明。
edge('M755 360 C685 535 300 535 225 360','edge-purple')
edgeLabel(490,525,'TTL 30m，或当前 Contact Email 已改变',{pill:true,width:300})
</script></body></html>
